name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck-and-unit-tests:
    name: Frontend type-check + backend unit tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux system deps (Tauri 2)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      # Frontend build first: type-checks the TS and produces dist/, which
      # tauri-build expects to exist when compiling the Rust side.
      - name: Frontend type-check + build
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Backend unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
