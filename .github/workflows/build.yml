name: Build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.platform }}
    # The secrets context is not allowed in if: conditionals — GitHub rejects the
    # whole workflow file at parse time. Secret *presence* flags go through env
    # instead; the secrets themselves are still read in the gated steps.
    env:
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
      HAS_AZURE: ${{ secrets.AZURE_CLIENT_ID != '' }}
      HAS_WINDOWS_PFX: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
      HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux system deps (Tauri 2)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - run: pnpm install --frozen-lockfile

      # --- macOS Code Signing & Notarization (Dormant) ---
      # Automatically activates if APPLE_CERTIFICATE secret is configured; skips silently otherwise.
      - name: Setup macOS code signing and notarization
        if: matrix.platform == 'macos-latest' && env.HAS_APPLE_CERT == 'true'
        run: |
          echo "APPLE_CERTIFICATE=${{ secrets.APPLE_CERTIFICATE }}" >> $GITHUB_ENV
          echo "APPLE_CERTIFICATE_PASSWORD=${{ secrets.APPLE_CERTIFICATE_PASSWORD }}" >> $GITHUB_ENV
          echo "APPLE_SIGNING_IDENTITY=${{ secrets.APPLE_SIGNING_IDENTITY }}" >> $GITHUB_ENV
          echo "APPLE_ID=${{ secrets.APPLE_ID }}" >> $GITHUB_ENV
          echo "APPLE_PASSWORD=${{ secrets.APPLE_PASSWORD }}" >> $GITHUB_ENV
          echo "APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}" >> $GITHUB_ENV

      - run: pnpm tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # --- Windows Azure Trusted Signing (Dormant) ---
      # Automatically activates if AZURE_CLIENT_ID secret is configured; skips silently otherwise.
      - name: Sign Windows bundles (Azure Trusted Signing)
        if: matrix.platform == 'windows-latest' && env.HAS_AZURE == 'true'
        uses: azure/trusted-signing-action@v0.5.1
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_ENDPOINT || 'https://eus.codesigning.azure.net' }}
          trusted-signing-account-name: ${{ secrets.AZURE_ACCOUNT_NAME }}
          certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE_NAME }}
          files-folder: src-tauri/target/release/bundle
          files-folder-filter: exe,msi
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # --- Windows Authenticode / PFX Signing (Dormant) ---
      # Automatically activates if WINDOWS_CERTIFICATE secret is configured; skips silently otherwise.
      - name: Sign Windows bundles (PFX Certificate)
        if: matrix.platform == 'windows-latest' && env.HAS_WINDOWS_PFX == 'true'
        shell: pwsh
        run: |
          $pfxBytes = [System.Convert]::FromBase64String("${{ secrets.WINDOWS_CERTIFICATE }}")
          $pfxPath = "$env:RUNNER_TEMP\cert.pfx"
          [System.IO.File]::WriteAllBytes($pfxPath, $pfxBytes)
          $password = "${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}"

          $signtool = (Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Filter "signtool.exe" -Recurse | Select-Object -First 1).FullName
          if (-not $signtool) {
            Write-Error "signtool.exe not found in Windows Kits"
            exit 1
          }

          Get-ChildItem -Path "src-tauri\target\release\bundle" -Include *.exe,*.msi -Recurse | ForEach-Object {
            Write-Host "Signing $($_.FullName)..."
            & $signtool sign /f $pfxPath /p $password /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $_.FullName
          }
          Remove-Item $pfxPath

      # --- Refresh Windows Updater Signatures (if post-build signing modified binaries) ---
      - name: Refresh Windows updater signatures
        if: matrix.platform == 'windows-latest' && (env.HAS_AZURE == 'true' || env.HAS_WINDOWS_PFX == 'true') && env.HAS_UPDATER_KEY == 'true'
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          Get-ChildItem -Path "src-tauri\target\release\bundle" -Filter "*.sig" -Recurse | ForEach-Object {
            $target = $_.FullName.Substring(0, $_.FullName.Length - 4)
            if (Test-Path $target) {
              Write-Host "Re-signing $target for updater..."
              pnpm tauri signer sign $target
            }
          }
      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.platform }}
          if-no-files-found: warn
          # Exact installer and updater artifact globs only: the appimage/macos bundle
          # dirs also contain build intermediates (AppDir contents, .app payload, icns)
          # that must not land on the release.
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
            src-tauri/target/release/bundle/nsis/*.zip*
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.msi.sig
            src-tauri/target/release/bundle/msi/*.zip*
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/dmg/*.tar.gz*
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.tar.gz*
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/deb/*.deb.sig

  release:
    # Publish a GitHub release with all bundles when a v* tag is pushed.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: bundles
          merge-multiple: true
      # Release first, manifest second: latest.json's `notes` field is the
      # release body (rendered by the in-app release-notes popover), so the
      # release must already exist with its generated notes before the
      # manifest can be authored. The second gh-release step then attaches
      # latest.json to the existing release instead of creating a new one.
      - uses: softprops/action-gh-release@v2
        with:
          files: bundles/**
          generate_release_notes: true
      - name: Generate updater manifest (latest.json)
        run: node scripts/generate-updater-manifest.mjs bundles
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # Auth for the release-body fetch (avoids the anonymous rate limit).
          GITHUB_TOKEN: ${{ github.token }}
      - name: Attach updater manifest to the release
        uses: softprops/action-gh-release@v2
        with:
          files: bundles/latest.json
