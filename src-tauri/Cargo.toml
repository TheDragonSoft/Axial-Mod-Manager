[package]
name = "axial"
version = "1.0.0"
description = "Axial — a desktop mod manager for Factorio"
authors = ["TheDragonSoft"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "axial_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
dirs = "6"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
async-trait = "0.1"
tokio = { version = "1", features = ["sync", "fs", "io-util", "time", "macros"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
sha1 = "0.10"
tracing = "0.1"
tracing-subscriber = "0.3"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
base64 = "0.22"
notify = "7"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
minisign-verify = "0.2"

# Enables `tauri::test` (MockRuntime) so activation paths can be driven from
# unit tests without a real window/event loop. Not enabled on Windows: linking
# MockRuntime makes the test binary fail to start with
# STATUS_ENTRYPOINT_NOT_FOUND (upstream: tauri-apps/tauri#13419, no fix yet);
# tests using it are gated the same way in packs.rs. CI (ubuntu) runs them.
[target.'cfg(not(target_os = "windows"))'.dev-dependencies]
tauri = { version = "2", features = ["test"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
